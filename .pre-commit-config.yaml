# Pre-commit configuration for quietscope.
# To install: pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^\.github/workflows/
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/golangci/golangci-lint
    rev: v1.59.1
    hooks:
      - id: golangci-lint

  - repo: local
    hooks:
      - id: go-fmt
        name: go-fmt
        entry: gofmt -w
        language: system
        files: \.go$
        pass_filenames: true

      - id: go-vet
        name: go-vet
        entry: go vet ./...
        language: system
        pass_filenames: false
        always_run: true

      - id: go-test
        name: go-test
        entry: go test ./...
        language: system
        pass_filenames: false
        always_run: true
