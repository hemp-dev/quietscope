<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quietscope Desktop Preview</title>
<style>
:root {
  --bg: #090b0e;
  --fg: #f1f5f9;
  --muted: #94a3b8;
  --panel: #11151c;
  --panel-hover: #1b202b;
  --line: #222936;
  --border-focus: #10b981;
  --accent: #10b981;
  --accent-glow: rgba(16, 185, 129, 0.15);
  --accent-2: #3b82f6;
  --accent-2-glow: rgba(59, 130, 246, 0.15);
  
  --bad: #f43f5e;
  --bad-glow: rgba(244, 63, 94, 0.15);
  --warn: #f59e0b;
  --warn-glow: rgba(245, 158, 11, 0.15);
  --ok: #10b981;
  --ok-glow: rgba(16, 185, 129, 0.15);
  
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  height: 100vh;
  overflow: hidden;
}

header {
  border-bottom: 1px solid var(--line);
  background: var(--panel);
  padding: 14px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 52px;
}

header h1 {
  font-size: 16px;
  margin: 0;
  font-weight: 700;
  letter-spacing: -0.25px;
  display: flex;
  align-items: center;
  gap: 8px;
}

header h1 svg {
  color: var(--accent);
}

.notice {
  font-size: 11px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.03);
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  font-weight: 600;
}

main {
  display: grid;
  grid-template-columns: 320px 1fr;
  height: calc(100vh - 52px);
  overflow: hidden;
}

/* Sidebar configuration styles */
.sidebar {
  border-right: 1px solid var(--line);
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
  background: #0d1015;
}

.panel-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
  margin-bottom: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
}

.sidebar-sub-title {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 12px;
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  text-transform: uppercase;
}

.form-group input[type="text"],
.form-group input[type="number"] {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--fg);
  border-radius: 8px;
  padding: 8px 12px;
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.form-group input[type="text"]:focus,
.form-group input[type="number"]:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 2px var(--accent-glow);
}

.checkbox-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.checkbox-label {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
  font-weight: 600;
}

.checkbox-label:hover {
  background: var(--panel-hover);
  border-color: var(--muted);
}

.checkbox-label input {
  margin: 0;
  accent-color: var(--accent);
}

button {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--fg);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

button.primary {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
}

button.primary:hover {
  filter: brightness(1.1);
  box-shadow: 0 0 12px var(--accent-glow);
}

button.danger {
  color: var(--bad);
  border-color: rgba(244, 63, 94, 0.2);
  background: rgba(244, 63, 94, 0.05);
}

button.danger:hover:not(:disabled) {
  background: rgba(244, 63, 94, 0.15);
  border-color: var(--bad);
}

button:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* Workspace Panels styling */
.workspace {
  display: grid;
  grid-template-rows: 180px 1fr;
  overflow: hidden;
  height: 100%;
}

.runs-panel {
  border-bottom: 1px solid var(--line);
  overflow-y: auto;
  padding: 16px 24px;
  background: #0c0e12;
}

.runs-list {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 8px;
}

.run-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  min-width: 220px;
  position: relative;
  overflow: hidden;
}

.run-item:hover {
  background: var(--panel-hover);
  border-color: var(--muted);
}

.run-item.active {
  border-color: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
  background: var(--panel-hover);
}

.run-item.active::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--accent);
}

.run-id {
  font-family: monospace;
  font-weight: 700;
  font-size: 13px;
}

.run-meta {
  font-size: 11px;
  color: var(--muted);
}

.run-status-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 4px;
}

.status-pill {
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid currentColor;
}

.status-pill.completed { color: var(--ok); background: var(--ok-glow); }
.status-pill.running, .status-pill.queued { color: var(--accent-2); background: var(--accent-2-glow); }
.status-pill.failed, .status-pill.canceled { color: var(--bad); background: var(--bad-glow); }

.detail-panel {
  display: grid;
  grid-template-columns: 340px 1fr;
  overflow: hidden;
  height: 100%;
}

.detail-section {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  border-right: 1px solid var(--line);
  padding: 24px;
  gap: 20px;
}

.detail-section:last-child {
  border-right: none;
  padding: 0;
}

/* Gauge Score widget */
.gauge-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: rgba(127,127,127,0.02);
  border: 1px solid var(--line);
  padding: 16px;
  border-radius: 12px;
  gap: 12px;
}

.gauge-svg-holder {
  position: relative;
  width: 110px;
  height: 110px;
}

.gauge-svg-holder svg {
  transform: rotate(-90deg);
}

.gauge-svg-holder .bg-ring {
  fill: none;
  stroke: var(--line);
  stroke-width: 8px;
}

.gauge-svg-holder .fill-ring {
  fill: none;
  stroke: var(--accent);
  stroke-width: 8px;
  stroke-linecap: round;
  stroke-dasharray: 282.74;
  stroke-dashoffset: 282.74;
  transition: stroke-dashoffset 0.8s ease-out, stroke 0.3s;
}

@keyframes gauge-pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

.gauge-svg-holder.scanning {
  animation: gauge-pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

.pulse-loader {
  animation: pulse 1.5s infinite;
  color: var(--accent-2);
  font-weight: 700;
}

.gauge-inner-text {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.gauge-num {
  font-size: 22px;
  font-weight: 800;
}

.gauge-lbl {
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
}

.gauge-level-badge {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 2px 10px;
  border-radius: 99px;
  border: 1px solid currentColor;
}

.metric-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.metric-card {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 12px;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.metric-card span {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  font-weight: 700;
}

.metric-card b {
  font-size: 16px;
  font-weight: 700;
}

.progress-container {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.progress-lbl-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  font-weight: 700;
}

.progress-bar-container {
  height: 8px;
  background: #090b0a;
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width 0.3s ease;
}

.terminal-header {
  border-bottom: 1px solid var(--line);
  background: #0a0d13;
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.terminal-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

.console-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: 100%;
}

.console {
  background: #05070a;
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
  font-size: 12px;
  white-space: pre-wrap;
  word-break: break-all;
  margin: 0;
  outline: none;
}

/* Console text coloring classes */
.log-line {
  display: block;
  margin-bottom: 4px;
  color: #a3b3c6;
}

.log-line.err { color: var(--bad); }
.log-line.warn { color: var(--warn); }
.log-line.ok { color: var(--ok); }
.log-line.info { color: var(--accent-2); }
.log-line.system { color: var(--muted); font-style: italic; }

.empty-state {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100%;
  color: var(--muted);
  font-size: 13px;
  gap: 12px;
}

.tab-btn {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 6px 12px;
  border-radius: 0;
  cursor: pointer;
  transition: all 0.2s;
}
.tab-btn:hover:not(:disabled) {
  color: var(--fg);
}
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.tab-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* Badge styling for desktop findings */
.badge {
  display: inline-block;
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 99px;
  border: 1px solid currentColor;
}
.badge.critical, .badge.high, .badge.FAIL {
  color: var(--bad);
  background: rgba(244, 63, 94, 0.15);
}
.badge.medium, .badge.warn, .badge.WARN {
  color: var(--warn);
  background: rgba(245, 158, 11, 0.15);
}
.badge.low, .badge.info, .badge.INFO {
  color: var(--accent-2);
  background: rgba(59, 130, 246, 0.15);
}
.badge.pass, .badge.PASS {
  color: var(--ok);
  background: rgba(16, 185, 129, 0.15);
}

.finding-card {
  transition: all 0.2s ease;
}
.finding-card:hover {
  background: var(--panel-hover) !important;
  border-color: var(--muted) !important;
}
.finding-card.active {
  border-color: var(--accent) !important;
  background: rgba(16, 185, 129, 0.05) !important;
  box-shadow: inset 0 0 0 1px var(--accent);
}
</style>
</head>
<body>

<header>
  <h1>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    Quietscope
  </h1>
  <div class="notice">Developer Preview v0.5.0</div>
</header>

<main>
  <!-- Sidebar panel config -->
  <div class="sidebar">
    <div class="panel-title">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06-.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Audit Configurations
    </div>
    <form id="config-form">
      <div class="sidebar-sub-title" title="Scope parameters for filesystem audits">Scan Scope</div>
      <div class="checkbox-grid" style="margin-bottom: 10px;">
        <label class="checkbox-label" title="Deep Scan: Inspects actual file contents (e.g. prompt rules) rather than just system metadata"><input type="checkbox" id="deep"><span>Deep Scan</span></label>
        <label class="checkbox-label" title="AI Audit: Analyzes local LLMs, MCP configurations, client/server ports, and security vectors"><input type="checkbox" id="ai-audit" checked><span>AI Audit</span></label>
        <label class="checkbox-label" title="No Sudo: Skips checks requiring administrative privileges to ensure non-intrusive scanning"><input type="checkbox" id="no-sudo" checked><span>No Sudo</span></label>
      </div>

      <div class="sidebar-sub-title" title="Formats to export your scan report assets">Report Formats</div>
      <div class="checkbox-grid">
        <label class="checkbox-label" title="HTML: Generates a self-contained offline security report dashboard"><input type="checkbox" id="want-html" checked><span>HTML</span></label>
        <label class="checkbox-label" title="JSON: Generates structured, machine-readable audit report payload"><input type="checkbox" id="want-json" checked><span>JSON</span></label>
        <label class="checkbox-label" title="Text: Generates a lightweight plain-text summary report"><input type="checkbox" id="want-text" checked><span>Text</span></label>
      </div>

      <div class="form-group">
        <label for="output-dir">Output Directory</label>
        <input type="text" id="output-dir" placeholder="Default Desktop folder">
      </div>

      <div class="form-group">
        <label for="project-root">Project Root (Deep Scan)</label>
        <input type="text" id="project-root" placeholder="Optional directory path">
      </div>

      <div class="form-group">
        <label for="max-file-size-mb">Max File Size (MiB)</label>
        <input type="number" id="max-file-size-mb" min="1" step="1" value="5">
      </div>

      <button type="submit" class="primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Start Defensive Audit
      </button>
    </form>
  </div>

  <!-- Workspace Panels (Runs List & Log Output) -->
  <div class="workspace">
    <div class="runs-panel">
      <div class="panel-title">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Active / Past Audits
      </div>
      <div class="runs-list" id="runs-list">
        <div class="empty-state">No audits initiated yet. Configure options and start an audit.</div>
      </div>
    </div>

    <!-- Active audit run details -->
    <div class="detail-panel" id="detail-panel">
      <div class="empty-state" style="grid-column: span 2;">Select or start an audit from the list.</div>
    </div>
  </div>
</main>

<script>
(function() {
  "use strict";

  let state = {
    jobs: [],
    selectedId: "",
    scrollLock: false,
    activeTab: "console",
    reportData: null,
    selectedFindingId: null,
    lastSelectedFindingId: null,
    lastSelectedId: null,
    lastJobsJson: ""
  };

  const scrollPositions = {
    runsListLeft: 0,
    runsListTop: 0,
    detailSecTop: 0,
    consoleTop: 0,
    findingsListTop: 0,
    detailsScrollTop: 0
  };

  function saveScrollPositions() {
    if (state.selectedId !== state.lastSelectedId) {
      scrollPositions.detailSecTop = 0;
      scrollPositions.consoleTop = 0;
      scrollPositions.findingsListTop = 0;
      scrollPositions.detailsScrollTop = 0;
      state.lastSelectedId = state.selectedId;
    }

    // 1. Sidebar runs list
    const runsList = document.getElementById("runs-list");
    if (runsList) {
      scrollPositions.runsListLeft = runsList.scrollLeft;
      scrollPositions.runsListTop = runsList.scrollTop;
    }
    // 2. Detail section (left pane in summary)
    const detailSec = document.querySelector(".detail-section");
    if (detailSec) {
      scrollPositions.detailSecTop = detailSec.scrollTop;
    }
    // 3. Console output
    const consoleOutput = document.getElementById("console-output");
    if (consoleOutput) {
      scrollPositions.consoleTop = consoleOutput.scrollTop;
    }
    // 4. Report findings list
    const findingsList = document.getElementById("report-findings-list");
    if (findingsList) {
      scrollPositions.findingsListTop = findingsList.scrollTop;
    }
    // 5. Finding details scroll container
    if (state.selectedFindingId !== state.lastSelectedFindingId) {
      scrollPositions.detailsScrollTop = 0;
      state.lastSelectedFindingId = state.selectedFindingId;
    } else {
      const detailsScroll = document.getElementById("finding-details-scroll-container");
      if (detailsScroll) {
        scrollPositions.detailsScrollTop = detailsScroll.scrollTop;
      }
    }
  }

  function restoreScrollPositions() {
    // 1. Sidebar runs list
    const runsList = document.getElementById("runs-list");
    if (runsList) {
      runsList.scrollLeft = scrollPositions.runsListLeft;
      runsList.scrollTop = scrollPositions.runsListTop;
    }
    // 2. Detail section
    const detailSec = document.querySelector(".detail-section");
    if (detailSec) {
      detailSec.scrollTop = scrollPositions.detailSecTop;
    }
    // 3. Console output
    const consoleOutput = document.getElementById("console-output");
    if (consoleOutput) {
      if (state.scrollLock) {
        consoleOutput.scrollTop = scrollPositions.consoleTop;
      } else {
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
      }
    }
    // 4. Report findings list
    const findingsList = document.getElementById("report-findings-list");
    if (findingsList) {
      findingsList.scrollTop = scrollPositions.findingsListTop;
    }
    // 5. Finding details scroll container
    const detailsScroll = document.getElementById("finding-details-scroll-container");
    if (detailsScroll) {
      detailsScroll.scrollTop = scrollPositions.detailsScrollTop;
    }
  }

  function escapeHTML(str) {
    if (!str) return "";
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  function formatBytes(bytes) {
    if (!bytes) return "0 B";
    const k = 1024;
    const sizes = ["B", "KiB", "MiB", "GiB"];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
  }

  window.copyRemediation = function(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text)
        .then(() => alert("Remediation information copied to clipboard!"))
        .catch(err => alert("Copy failed: " + err));
    } else {
      window.prompt("Copy Remediation Info:", text);
    }
  };

  window.selectFinding = function(id) {
    state.selectedFindingId = id;
    const cards = document.querySelectorAll(".finding-card");
    cards.forEach(card => {
      if (card.getAttribute("data-id") === id) {
        card.classList.add("active");
      } else {
        card.classList.remove("active");
      }
    });
    
    const detailsPane = document.getElementById("finding-details-pane");
    if (!detailsPane || !state.reportData) return;
    
    const f = (state.reportData.findings || []).find(x => x.id === id);
    if (!f) {
      detailsPane.innerHTML = '<div class="empty-state">Select a finding from the list.</div>';
      return;

  window.toggleScrollLock = function(checked) {
    state.scrollLock = checked;
  };

  window.switchTab = function(tabName) {
    state.activeTab = tabName;
    if (tabName === "report" && state.selectedId) {
      if (window.go && window.go.main && window.go.main.App) {
        window.go.main.App.GetReportJSON(state.selectedId)
          .then(jsonStr => {
            state.reportData = JSON.parse(jsonStr);
            if (state.reportData && state.reportData.findings && state.reportData.findings.length > 0) {
              state.selectedFindingId = state.reportData.findings[0].id;
            } else {
              state.selectedFindingId = null;
            }
            render();
            
            // Populate categories dynamically
            const catSelect = document.getElementById("report-category");
            if (catSelect) {
              const cats = Array.from(new Set((state.reportData.findings || []).map(f => f.category).filter(Boolean))).sort();
              while (catSelect.options.length > 1) { catSelect.remove(1); }
              cats.forEach(c => {
                const o = document.createElement("option");
                o.value = c;
                o.textContent = c;
                catSelect.appendChild(o);
              });
            }
            window.filterDesktopFindings();
          })
          .catch(err => {
            console.error("Failed to load report:", err);
            state.activeTab = "console";
            render();
            alert("Could not load report data: " + err);
          });
      }
    } else {
      render();
    }
  };

  window.filterDesktopFindings = function() {
    const q = document.getElementById("report-search") ? document.getElementById("report-search").value.toLowerCase() : "";
    const sev = document.getElementById("report-severity") ? document.getElementById("report-severity").value : "";
    const cat = document.getElementById("report-category") ? document.getElementById("report-category").value : "";

    const listContainer = document.getElementById("report-findings-list");
    if (!listContainer || !state.reportData) return;

    const filtered = (state.reportData.findings || []).filter(f => {
      const blob = JSON.stringify(f).toLowerCase();
      if (q && !blob.includes(q)) return false;
      if (sev && f.severity !== sev) return false;
      if (cat && f.category !== cat) return false;
      return true;
    });

    if (filtered.length > 0) {
      if (!filtered.some(f => f.id === state.selectedFindingId)) {
        state.selectedFindingId = filtered[0].id;
      }
    } else {
      state.selectedFindingId = null;
    }

    if (!filtered.length) {
      listContainer.innerHTML = '<div class="empty-state" style="padding: 20px; text-align: center;">No matching findings.</div>';
      const detailsPane = document.getElementById("finding-details-pane");
      if (detailsPane) {
        detailsPane.innerHTML = '<div class="empty-state">No matching findings to analyze.</div>';
      }
      return;
    }

    listContainer.innerHTML = filtered.map(f => {
      const cardActive = f.id === state.selectedFindingId ? "active" : "";
      return `
        <div class="finding-card ${cardActive}" onclick="window.selectFinding('${f.id}')" data-id="${f.id}" style="padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span class="badge ${f.severity}">${f.severity}</span>
            <span class="badge ${f.status}" style="font-size: 8px; padding: 1px 4px;">${f.status}</span>
          </div>
          <div style="font-size: 12px; font-weight: 700; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${escapeHTML(f.title)}">${escapeHTML(f.title)}</div>

            <span>${escapeHTML(f.category)}</span>
            <span>${f.estimated_size_bytes ? 'Reclaimable' : ''}</span>
          </div>
        </div>
      `;
    }).join("");

    const detailsPane = document.getElementById("finding-details-pane");
    if (detailsPane) {
      const selected = filtered.find(f => f.id === state.selectedFindingId);
      if (selected) {
        detailsPane.innerHTML = renderDetailsHTML(selected);
      } else {
        detailsPane.innerHTML = '<div class="empty-state">Select a finding from the list.</div>';

  function refreshJobs() {
    if (!window.go || !window.go.main || !window.go.main.App) return;

    window.go.main.App.GetJobs()
      .then(jsonStr => {
        if (state.lastJobsJson === jsonStr) {
          return;
        }
        state.lastJobsJson = jsonStr;
        state.jobs = JSON.parse(jsonStr) || [];
        render();
      })
      .catch(err => console.error("Failed to load jobs:", err));
  }

  function formatTime(v) {
    if (!v || v.startsWith("0001-")) return "-";
    const d = new Date(v);
    return Number.isNaN(d.getTime()) ? "-" : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function getDuration(job) {
    if (!job.started_at || job.started_at.startsWith("0001-")) return "-";
    const start = Date.parse(job.started_at);
    if (Number.isNaN(start)) return "-";
    
    const end = job.finished_at && !job.finished_at.startsWith("0001-") ? Date.parse(job.finished_at) : Date.now();
    if (Number.isNaN(end)) return "-";
    
    const ms = end - start;
    if (ms < 0) return "0.0s";
    return (ms / 1000).toFixed(1) + "s";
  }

  function getProgressPercentage(job) {
    if (job.status === "completed") return 100;
    if (!job.events || !job.events.length) return 0;
    const latest = job.events[job.events.length - 1];
    if (!latest.total) return 0;
    return Math.round((latest.completed / latest.total) * 100);
  }

  // Parse terminal logs dynamically to color code lines
  function formatConsoleLog(events) {
    if (!events || !events.length) return `<span class="log-line system">Waiting for execution progress events...</span>`;
    
    return events.map(ev => {
      const prefix = ev.type ? `[${ev.type}] ` : "";
      const check = ev.check_name ? `${ev.check_name} ` : "";
      const progress = ev.total ? `(${ev.completed}/${ev.total}) ` : "";
      const duration = ev.duration_ms ? ` (${ev.duration_ms}ms)` : "";
      const err = ev.error ? ` [ERROR: ${ev.error}]` : "";
      
      const text = `${prefix}${progress}${check}${ev.message}${duration}${err}`;
      
      let styleClass = "log-line";
      const normText = text.toLowerCase();
      if (normText.includes("error") || normText.includes("fail")) {
        styleClass += " err";
      } else if (normText.includes("warn")) {
        styleClass += " warn";
      } else if (normText.includes("pass") || normText.includes("completed") || normText.includes("success")) {
        styleClass += " ok";
      } else if (normText.includes("info")) {
        styleClass += " info";
      } else if (normText.includes("system") || normText.includes("queued") || normText.includes("started")) {
        styleClass += " system";
      }
      
      return `<span class="${styleClass}">${text}</span>`;
    }).join("");
  }

    if (state.activeTab === 'console') {
      const consoleDiv = document.getElementById("console-output");
      if (consoleDiv && !state.scrollLock) {
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
      }
    } else {
      // Re-populate and render findings table if we are returning to this view
      window.filterDesktopFindings();
    }

    restoreScrollPositions();
  }

  window.selectJob = function(id) {
    state.selectedId = id;
    render();
  };

  window.cancelJob = function(id) {
    if (!window.go || !window.go.main || !window.go.main.App) return;
    window.go.main.App.CancelAudit(id)
      .then(() => refreshJobs())
      .catch(err => alert("Cancel failed: " + err));
  };

  window.openReport = function(url) {
    if (!window.go || !window.go.main || !window.go.main.App) return;
    window.go.main.App.OpenReport(url)
      .catch(err => alert("Could not open report: " + err));
  };

  document.getElementById("config-form").addEventListener("submit", function(evt) {
    evt.preventDefault();
    if (!window.go || !window.go.main || !window.go.main.App) return;

    const payload = {
      want_text: document.getElementById("want-text").checked,
      want_json: document.getElementById("want-json").checked,
      want_html: document.getElementById("want-html").checked,
      deep: document.getElementById("deep").checked,
      ai_audit: document.getElementById("ai-audit").checked,
      no_sudo: document.getElementById("no-sudo").checked,
      output_dir: document.getElementById("output-dir").value.trim(),
      project_root: document.getElementById("project-root").value.trim(),
      max_file_size_mb: parseInt(document.getElementById("max-file-size-mb").value) || 5
    };

    window.go.main.App.StartAudit(JSON.stringify(payload))
      .then(jobId => {
        state.selectedId = jobId;
        refreshJobs();
      })
      .catch(err => alert("Start Audit failed: " + err));
  });

  // Wails runtime bindings
  document.addEventListener("DOMContentLoaded", () => {
    refreshJobs();
    setInterval(refreshJobs, 1000);

    // Listen to Wails events for reactive live reloading!
    if (window.runtime) {
      window.runtime.EventsOn("job_added", () => refreshJobs());
      window.runtime.EventsOn("job_started", () => refreshJobs());
      window.runtime.EventsOn("job_finished", () => refreshJobs());
      window.runtime.EventsOn("job_canceling", () => refreshJobs());
    }
  });
})();
</script>
</body>
</html>
