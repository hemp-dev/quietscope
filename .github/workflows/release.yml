name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: go test ./...
      - name: Build release assets
        run: |
          set -eu
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/quietscope_darwin_arm64 ./cmd/quietscope
          GOOS=darwin GOARCH=amd64 go build -trimpath -o dist/quietscope_darwin_amd64 ./cmd/quietscope
          GOOS=linux GOARCH=amd64 go build -trimpath -o dist/quietscope_linux_amd64 ./cmd/quietscope
          GOOS=windows GOARCH=amd64 go build -trimpath -o dist/quietscope_windows_amd64.exe ./cmd/quietscope
      - name: Generate checksums
        run: |
          set -eu
          cd dist
          sha256sum quietscope_* > SHA256SUMS
      - name: Publish GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
